name: One-off harden experimental DMX Editable Mesh

on:
  push:
    branches:
      - fix/experimental-dmx-editable-mesh

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[harden-dmx-mesh]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/experimental-dmx-editable-mesh
          fetch-depth: 0
      - name: Harden experimental DMX mesh support
        shell: pwsh
        run: .github/oneoff-harden-dmx-mesh.ps1
