name: Branch hygiene

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: deadlimit-branch-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete merged PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$HEAD_REF" && "$HEAD_REF" != "main" ]]; then
            git push origin --delete "$HEAD_REF" || true
          fi
