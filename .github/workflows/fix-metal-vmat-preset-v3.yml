name: Fix metal VMAT preset v3

on:
  push:
    branches: [ fix/metal-vmat-preset-values ]
    paths:
      - '.github/workflows/fix-metal-vmat-preset-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply metal preset fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs')
          text = source_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private const string MetalPresetValue = "0.750";\n'
              '    private const string MetalPresetRoughnessValue = "0.250";',
              '    private const string MetalPresetValue = "0.800";\n'
              '    private const string MetalPresetRoughness = "[0.501961 0.501961 0.501961 0.000000]";')

          replace_once(
              '        log.AppendLine("Metal naming: any custom material whose name contains \'metal\' (prefix, suffix, or middle; case-insensitive) receives the metal preset: Metalness 0.75 and Glossiness 0.75. The modifier is independent from vertexcolor and may be combined with it.");',
              '        log.AppendLine("Metal naming: any custom material whose name contains \'metal\' (prefix, suffix, or middle; case-insensitive) receives the metal preset: Metalness 0.8 and Roughness 128/255. The modifier is independent from vertexcolor and may be combined with it.");')

          standard_call = (
              '        body = ReconcileMetalnessTextureCombo(body, HasBinding(standardBindings, "TextureMetalness"));\n'
              '        body = ApplyMaterialNameModifiers(body, customReference);')
          standard_replacement = (
              '        body = ReconcileMetalnessTextureCombo(body, HasBinding(standardBindings, "TextureMetalness"));\n'
              '        body = ApplyMaterialNameModifiers(body, customReference, vertexColorMode: false);')
          if text.count(standard_call) != 2:
              raise SystemExit(f'Expected two standard material modifier calls, found {text.count(standard_call)}')
          text = text.replace(standard_call, standard_replacement)

          vertex_call = (
              '        body = UpsertStringParameter(body, "F_VERTEX_COLOR", "1");\n'
              '        body = ApplyMaterialNameModifiers(body, customReference);')
          vertex_replacement = (
              '        body = UpsertStringParameter(body, "F_VERTEX_COLOR", "1");\n'
              '        body = ApplyMaterialNameModifiers(body, customReference, vertexColorMode: true);')
          if text.count(vertex_call) != 2:
              raise SystemExit(f'Expected two vertex-color material modifier calls, found {text.count(vertex_call)}')
          text = text.replace(vertex_call, vertex_replacement)

          helper_anchor = (
              '    private static bool HasStringParameter(string text, string key) =>\n'
              '        StringParameterRegex.Matches(text)\n'
              '            .Any(match => string.Equals(GetStringParameterKey(match), key, StringComparison.OrdinalIgnoreCase));\n\n')
          texture_helper = '''    private static string UpsertTextureAssignment(string text, string key, string value)
          {
              var useCrLf = text.Contains("\\r\\n", StringComparison.Ordinal);
              var normalized = useCrLf ? text.Replace("\\r\\n", "\\n", StringComparison.Ordinal) : text;
              var found = false;
              var patched = TextureAssignmentRegex.Replace(normalized, match =>
              {
                  if (!string.Equals(GetTextureKey(match), key, StringComparison.OrdinalIgnoreCase))
                  {
                      return match.Value;
                  }

                  if (found)
                  {
                      return string.Empty;
                  }

                  found = true;
                  return match.Groups["prefix"].Value + value + match.Groups["suffix"].Value;
              });

              if (!found)
              {
                  var closingBrace = patched.LastIndexOf('}');
                  if (closingBrace < 0)
                  {
                      throw new InvalidDataException("Generated/inherited VMAT did not contain a closing Layer0 brace.");
                  }

                  patched = patched.Insert(closingBrace, $"    \\\"{key}\\\"\\t\\\"{value}\\\"\\n");
              }

              return useCrLf ? patched.Replace("\\n", "\\r\\n", StringComparison.Ordinal) : patched;
          }

          '''
          replace_once(helper_anchor, texture_helper + helper_anchor)

          method_pattern = re.compile(
              r'    private static string ApplyMaterialNameModifiers\(string text, string customReference\)\n'
              r'    \{\n.*?\n    \}\n\n'
              r'    private static TextureReplacement ResolveTextureReplacement\(',
              re.DOTALL)
          new_method = '''    private static string ApplyMaterialNameModifiers(
              string text,
              string customReference,
              bool vertexColorMode)
          {
              if (!IsMetalMaterialReference(customReference))
              {
                  return text;
              }

              var patched = UpsertStringParameter(text, "g_flMetalness", MetalPresetValue);
              var roughnessKey = vertexColorMode ? "TextureRoughness1" : "TextureRoughness";
              return UpsertTextureAssignment(patched, roughnessKey, MetalPresetRoughness);
          }

              private static TextureReplacement ResolveTextureReplacement('''
          text, method_count = method_pattern.subn(new_method, text, count=1)
          if method_count != 1:
              raise SystemExit(f'Expected one ApplyMaterialNameModifiers method, replaced {method_count}')

          source_path.write_text(text, encoding='utf-8', newline='\n')

          workflow_path = Path('.github/workflows/build.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow_needle = (
              '      - name: Build Deadlimit Manager\n'
              '        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore\n'
              '      - name: Verify Manager and updater contract\n')
          workflow_replacement = (
              '      - name: Build Deadlimit Manager\n'
              '        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore\n'
              '      - name: Metal material preset smoke\n'
              '        shell: pwsh\n'
              '        run: internal/tests/metal-material-preset-smoke.ps1\n'
              '      - name: Verify Manager and updater contract\n')
          if workflow.count(workflow_needle) != 1:
              raise SystemExit(f'Expected build workflow insertion point once, found {workflow.count(workflow_needle)}')
          workflow = workflow.replace(workflow_needle, workflow_replacement, 1)
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')
          PY

      - name: Verify focused diff
        shell: pwsh
        run: |
          git diff --check
          $diff = git diff -- internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs .github/workflows/build.yml
          if (-not ($diff -match 'MetalPresetValue = "0.800"')) { throw 'Metalness 0.800 fix missing.' }
          if (-not ($diff -match '0.501961 0.501961 0.501961')) { throw 'Roughness 128/255 fix missing.' }
          if (-not ($diff -match 'metal-material-preset-smoke.ps1')) { throw 'Permanent regression smoke was not wired into CI.' }

      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj

      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore

      - name: Metal preset regression smoke
        shell: pwsh
        run: internal/tests/metal-material-preset-smoke.ps1

      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke

      - name: Commit fix and remove one-shot workflows
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs internal/tests/metal-material-preset-smoke.ps1 .github/workflows/build.yml
          git rm .github/workflows/fix-metal-vmat-preset.yml .github/workflows/fix-metal-vmat-preset-v2.yml .github/workflows/fix-metal-vmat-preset-v3.yml
          git commit -m "Fix metal VMAT preset parameters"
          git push origin HEAD:fix/metal-vmat-preset-values
