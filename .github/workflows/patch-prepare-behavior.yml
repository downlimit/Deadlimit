name: One-shot prepare behavior patch

on:
  push:
    branches:
      - fix/prepare-texture-sync-online-pulse

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix prepare texture sync and online pulse'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepare-texture-sync-online-pulse
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply patch
        shell: pwsh
        run: internal/tests/_patch-prepare-behavior.ps1
      - name: Fix generated smoke quoting
        shell: pwsh
        run: |
          $path = 'internal/tests/prepare-behavior-smoke.ps1'
          $lines = Get-Content -LiteralPath $path
          $lines = $lines | ForEach-Object {
            if ($_ -match '^\$source = .*TextureColor') {
              '$source = "Layer0`n{`n    `"TextureColor`"`t`"[0.5 0.5 0.5 0]`"`n}`n"'
            }
            else {
              $_
            }
          }
          Set-Content -LiteralPath $path -Value $lines -Encoding utf8NoBOM
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Existing metal preset smoke
        shell: pwsh
        run: internal/tests/metal-material-preset-smoke.ps1
      - name: Existing texture alias smoke
        shell: pwsh
        run: internal/tests/texture-naming-alias-smoke.ps1
      - name: Prepare behavior smoke
        shell: pwsh
        run: internal/tests/prepare-behavior-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/src/Deadlimit/App/BuildFeature.cs internal/src/Deadlimit/App/ProjectHeaderFeature.cs internal/src/Deadlimit/App/OnlineCsdkPulseFeature.cs internal/src/Deadlimit/Core/PrepareAuthoringService.cs internal/src/Deadlimit/Core/ProjectTextureBindingService.cs internal/tests/prepare-behavior-smoke.ps1
          git commit -m 'Fix prepare texture sync and online pulse'
          git push origin HEAD:fix/prepare-texture-sync-online-pulse
