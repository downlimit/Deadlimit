name: One-off fix experimental DMX Editable Mesh

on:
  push:
    branches:
      - fix/experimental-dmx-editable-mesh

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-dmx-mesh]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/experimental-dmx-editable-mesh
          fetch-depth: 0
      - name: Patch experimental DMX mesh support
        shell: pwsh
        run: .github/oneoff-fix-experimental-dmx-mesh.ps1
