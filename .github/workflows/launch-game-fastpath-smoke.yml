name: Launch game fastpath smoke

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify launch-game source contract
        shell: pwsh
        run: internal/tests/launch-game-fastpath-smoke.ps1

  native-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify launch-game fastpath contract
        shell: pwsh
        run: internal/tests/launch-game-fastpath-smoke.ps1
      - name: Verify window switching contract
        shell: pwsh
        run: internal/tests/window-shell-visibility-smoke.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build Deadlimit Manager
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Verify retail SearchPaths contract
        shell: pwsh
        run: internal/tests/retail-mod-loading-searchpaths-smoke.ps1
