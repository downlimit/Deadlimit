name: Fix retail VMAT leaf resolution

on:
  push:
    branches: [ fix/retail-vmat-leaf-resolution ]
    paths:
      - '.github/workflows/fix-retail-vmat-leaf-resolution.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply retail VMAT leaf fallback
        shell: pwsh
        run: |
          $path = 'internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs'
          $text = [IO.File]::ReadAllText($path)
          $startMarker = '    private (string Text, string VpkPath) DecompileRetailMaterialTemplate('
          $endMarker = '    private IEnumerable<string> EnumerateRetailVpks('
          $start = $text.IndexOf($startMarker, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw 'DecompileRetailMaterialTemplate start marker not found.' }
          $end = $text.IndexOf($endMarker, $start, [StringComparison]::Ordinal)
          if ($end -lt 0) { throw 'EnumerateRetailVpks end marker not found.' }
          $replacementBase64 = ''
          $replacement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($replacementBase64))
          $patched = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          [IO.File]::WriteAllText($path, $patched, [Text.UTF8Encoding]::new($false))
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          $diff = git diff -- internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs
          if (-not ($diff -match 'filename-only resolution was ambiguous')) { throw 'Ambiguity guard missing.' }
          if (-not ($diff -match 'compiledLeafNames')) { throw 'Leaf-name fallback missing.' }
          if (-not ($diff -match 'DecompileRetailMaterialEntry')) { throw 'Resolved-entry decompile helper missing.' }
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Metal material preset smoke
        shell: pwsh
        run: internal/tests/metal-material-preset-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs
          git commit -m "Resolve short retail VMAT references by unique filename"
          git push origin HEAD:fix/retail-vmat-leaf-resolution
