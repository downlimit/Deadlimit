name: TGA Settings patch

on:
  push:
    branches: [ feature/hero-texture-extraction ]

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/hero-texture-extraction
          fetch-depth: 0
      - name: Patch SettingsForm
        shell: pwsh
        run: |
          $path = 'internal/src/Deadlimit/App/SettingsForm.cs'
          $text = Get-Content -LiteralPath $path -Raw
          if ($text.Contains('_exportExtractedTexturesAsTgaCheck')) {
            Write-Host 'TGA Settings UI is already present.'
            exit 0
          }
          $nl = [Environment]::NewLine
          function Insert-After([string]$Anchor, [string[]]$Lines) {
            if (-not $script:text.Contains($Anchor)) { throw "Missing SettingsForm anchor: $Anchor" }
            $script:text = $script:text.Replace($Anchor, $Anchor + $nl + ($Lines -join $nl))
          }
          function Replace-One([string]$Old, [string]$New) {
            if (-not $script:text.Contains($Old)) { throw "Missing SettingsForm anchor: $Old" }
            $script:text = $script:text.Replace($Old, $New)
          }

          Insert-After '    private readonly CheckBox _extractHeroTexturesCheck = new()' @()
          $fieldAnchor = '    private readonly CheckBox _extractHeroTexturesCheck = new()' + $nl + '    {' + $nl + '        AutoSize = true,' + $nl + '        Anchor = AnchorStyles.Left,' + $nl + '    };'
          Replace-One $fieldAnchor ($fieldAnchor + $nl + $nl + (@(
            '    private readonly CheckBox _exportExtractedTexturesAsTgaCheck = new()'
            '    {'
            '        AutoSize = true,'
            '        Anchor = AnchorStyles.Left,'
            '    };'
          ) -join $nl))

          Insert-After '    private readonly bool _initialExtractHeroTextures;' @(
            '    private readonly bool _initialExportExtractedTexturesAsTga;'
          )
          Insert-After '        _initialExtractHeroTextures = settings.ExtractHeroTextures;' @(
            '        _initialExportExtractedTexturesAsTga = settings.ExportExtractedTexturesAsTga;'
          )
          Insert-After '        _extractHeroTexturesCheck.Checked = settings.ExtractHeroTextures;' @(
            '        _exportExtractedTexturesAsTgaCheck.Checked = settings.ExportExtractedTexturesAsTga;'
          )
          Insert-After '        _extractHeroTexturesCheck.CheckedChanged += (_, _) => UpdateSettingsActionState();' @(
            '        _exportExtractedTexturesAsTgaCheck.CheckedChanged += (_, _) => UpdateSettingsActionState();'
          )
          Replace-One '            RowCount = 5,' '            RowCount = 6,'
          Replace-One '        AddCsdkCacheToolRow(preferencesGrid, 3);' ('        AddExtractedTextureTgaRow(preferencesGrid, 3);' + $nl + '        AddCsdkCacheToolRow(preferencesGrid, 4);')
          Replace-One '        AddScriptsFolderRow(preferencesGrid, 4);' '        AddScriptsFolderRow(preferencesGrid, 5);'
          Replace-One '            || _initialExtractHeroTextures != _extractHeroTexturesCheck.Checked;' ('            || _initialExtractHeroTextures != _extractHeroTexturesCheck.Checked' + $nl + '            || _initialExportExtractedTexturesAsTga != _exportExtractedTexturesAsTgaCheck.Checked;')

          $rowAnchor = '    private void AddScriptsFolderRow(TableLayoutPanel grid, int row)'
          $rowLines = @(
            '    private void AddExtractedTextureTgaRow(TableLayoutPanel grid, int row)'
            '    {'
            '        grid.RowStyles.Add(new RowStyle(SizeType.AutoSize));'
            '        grid.Controls.Add(CreatePreferenceCaption(UiText.T("Extracted texture copies", "Копии извлечённых текстур")), 0, row);'
            '        _exportExtractedTexturesAsTgaCheck.Text = UiText.T("Create TGA copies", "Создавать TGA-копии");'
            '        _exportExtractedTexturesAsTgaCheck.Margin = new Padding(0, 7, 8, 7);'
            '        _toolTip.SetToolTip('
            '            _exportExtractedTexturesAsTgaCheck,'
            '            UiText.T('
            '                "When enabled, EXTRACT HERO SOURCE creates a same-name 32-bit TGA beside every extracted PNG texture in 0source. Alpha is preserved. HDR/EXR textures are left unchanged. These TGA files are generated reference data and do not affect PREPARE.",'
            '                "Если включено, ИЗВЛЕЧЬ ИСХОДНИКИ ГЕРОЯ создаёт рядом с каждой извлечённой PNG-текстурой в 0source одноимённую 32-битную TGA-копию. Альфа сохраняется. HDR/EXR остаются без изменений. Эти TGA — справочные сгенерированные файлы и не влияют на ПОДГОТОВКУ."));'
            '        grid.Controls.Add(_exportExtractedTexturesAsTgaCheck, 1, row);'
            '    }'
            ''
          )
          Replace-One $rowAnchor (($rowLines -join $nl) + $rowAnchor)
          Insert-After '        _extractHeroTexturesCheck.Enabled = !_busy;' @(
            '        _exportExtractedTexturesAsTgaCheck.Enabled = !_busy;'
          )
          Insert-After '            ExtractHeroTextures = _extractHeroTexturesCheck.Checked,' @(
            '            ExportExtractedTexturesAsTga = _exportExtractedTexturesAsTgaCheck.Checked,'
          )

          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          git config user.name 'Oleg Knyazev'
          git config user.email 'down.limit@gmail.com'
          git add -- $path
          if (git diff --cached --quiet) { exit 0 }
          git commit -s -m 'Expose optional TGA copies in Settings'
          git push origin HEAD:feature/hero-texture-extraction
