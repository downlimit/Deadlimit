name: TGA Settings patch

on:
  push:
    branches: [ feature/hero-texture-extraction ]

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/hero-texture-extraction
          fetch-depth: 0
      - name: Fix Settings tools row count
        shell: pwsh
        run: |
          $path = 'internal/src/Deadlimit/App/SettingsForm.cs'
          $text = Get-Content -LiteralPath $path -Raw
          if (-not $text.Contains('_exportExtractedTexturesAsTgaCheck')) {
            throw 'TGA Settings UI was not applied before cleanup.'
          }
          $old = @"
    private static TableLayoutPanel CreateToolsGrid()
    {
        var grid = new TableLayoutPanel
        {
            AutoSize = true,
            AutoSizeMode = AutoSizeMode.GrowAndShrink,
            ColumnCount = 7,
            RowCount = 6,
"@
          $new = @"
    private static TableLayoutPanel CreateToolsGrid()
    {
        var grid = new TableLayoutPanel
        {
            AutoSize = true,
            AutoSizeMode = AutoSizeMode.GrowAndShrink,
            ColumnCount = 7,
            RowCount = 5,
"@
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          }
          git config user.name 'Oleg Knyazev'
          git config user.email 'down.limit@gmail.com'
          git add -- $path
          if (git diff --cached --quiet) { exit 0 }
          git commit -s -m 'Restore Settings tools grid row count'
          git push origin HEAD:feature/hero-texture-extraction
