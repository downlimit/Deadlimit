name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Startup smoke diagnostic
        shell: pwsh
        run: |
          $exe = Resolve-Path 'internal/src/Deadlimit/bin/Release/net10.0-windows/Deadlimit.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'deadlimit-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'deadlimit-stderr.txt'
          $diag = Join-Path $env:RUNNER_TEMP 'deadlimit-startup.txt'
          $env:DEADLIMIT_STARTUP_DIAGNOSTIC = $diag
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Write-Host 'Deadlimit exited during startup.'
            Write-Host "Exit code: $($process.ExitCode)"
            if (Test-Path $diag) { Write-Host '--- startup diagnostic ---'; Get-Content $diag }
            if (Test-Path $stdout) { Write-Host '--- stdout ---'; Get-Content $stdout }
            if (Test-Path $stderr) { Write-Host '--- stderr ---'; Get-Content $stderr }
            throw 'Startup smoke failed.'
          }
          if (Test-Path $diag) { Write-Host '--- startup diagnostic ---'; Get-Content $diag }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Deadlimit stayed alive for the startup smoke window.'
