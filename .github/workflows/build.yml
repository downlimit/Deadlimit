name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open-source content policy
        shell: pwsh
        run: internal/tests/open-source-content-policy-smoke.ps1
      - name: Portable path defaults
        shell: pwsh
        run: internal/tests/portable-path-defaults-smoke.ps1
      - name: Portable updater transaction smoke
        shell: pwsh
        run: internal/tests/portable-release-smoke.ps1
      - name: Installer and unified updater smoke
        shell: pwsh
        run: internal/tests/installer-updater-smoke.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build Deadlimit Manager
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Metal material preset smoke
        shell: pwsh
        run: internal/tests/metal-material-preset-smoke.ps1
      - name: Texture naming alias smoke
        shell: pwsh
        run: internal/tests/texture-naming-alias-smoke.ps1
      - name: Prepare behavior smoke
        shell: pwsh
        run: internal/tests/prepare-behavior-smoke.ps1
      - name: UI localization smoke
        shell: pwsh
        run: internal/tests/ui-localization-smoke.ps1
      - name: Verify Manager and updater contract
        shell: pwsh
        run: |
          $output = 'internal/src/Deadlimit/bin/Release/net10.0-windows'
          if (-not (Test-Path "$output/DeadlimitManager.exe")) {
            throw 'DeadlimitManager.exe was not produced.'
          }
          if (Test-Path "$output/DeadlimitAggregator.exe") {
            throw 'Legacy DeadlimitAggregator.exe was produced.'
          }
          if (Test-Path "$output/Deadlimit.exe") {
            throw 'Legacy Deadlimit.exe was produced.'
          }

          $requiredFiles = @(
            'DeadlimitManager.cmd',
            'Update Deadlimit.cmd',
            'Install-Deadlimit.cmd',
            'DeadlimitUpdater.bat',
            'internal/DeadlimitUpdater.ps1',
            'internal/DeadlimitManager.cmd',
            'internal/DeadlimitManagerLauncher.vbs',
            'internal/assets/DeadlimitManager_128_v4.ico',
            'internal/assets/DeadlimitUpdater_128_v4.ico'
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required Manager/updater entry point or asset is missing: $path"
            }
          }

          $requiredStrings = @(
            @{ Path = 'DeadlimitManager.cmd'; Pattern = 'Deadlimit Manager.lnk' },
            @{ Path = 'DeadlimitManager.cmd'; Pattern = 'Deadlimit Updater.lnk' },
            @{ Path = 'DeadlimitManager.cmd'; Pattern = 'DeadlimitManager.exe' },
            @{ Path = 'DeadlimitManager.cmd'; Pattern = "@('Deadlimit Manager.lnk','Deadlimit Updater.lnk')" },
            @{ Path = 'Update Deadlimit.cmd'; Pattern = 'DeadlimitUpdater.bat' },
            @{ Path = 'Update Deadlimit.cmd'; Pattern = 'internal\DeadlimitPortableUpdater.ps1' },
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = 'Loading the latest Deadlimit Updater from origin/main' },
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = 'fetch origin main' },
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = 'show origin/main:internal/DeadlimitUpdater.ps1' },
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = 'DEADLIMIT_UPDATER_ROOT' },
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = 'DEADLIMIT_UPDATER_BOOTSTRAPPED' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = '$PSScriptRoot' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = '$env:DEADLIMIT_UPDATER_ROOT' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'ResolveRootOnly' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'NoWait' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Latest Deadlimit Updater loaded; origin/main is already refreshed.' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Checking origin/main for Deadlimit updates' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'diff --no-renames --name-only HEAD --' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'diff --no-renames --name-only $oldHead origin/main --' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'origin/main also changes files you are editing locally' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'No stash, reset, or local-file overwrite was performed' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Updating the Deadlimit repository from origin/main' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'DeadlimitManager.cmd' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = '--refresh-only' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Updated Deadlimit:' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'log --reverse --pretty=format:' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'diff --stat $oldHead $newHead' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Press any key to close' },
            @{ Path = 'internal/src/Deadlimit/App/WindowProgressFeature.cs'; Pattern = 'UiText.ProductName' },
            @{ Path = 'internal/src/Deadlimit/Program.cs'; Pattern = 'Usage: DeadlimitManager.exe' }
          )
          foreach ($check in $requiredStrings) {
            if (-not (Select-String -LiteralPath $check.Path -SimpleMatch $check.Pattern -Quiet)) {
              throw "Required Manager/updater contract is missing in $($check.Path): $($check.Pattern)"
            }
          }

          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'internal/DeadlimitUpdater.ps1'),
            [ref]$tokens,
            [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw "DeadlimitUpdater.ps1 has PowerShell parse errors: $($parseErrors -join '; ')"
          }

          $forbidden = @(
            @{ Path = 'DeadlimitUpdater.bat'; Pattern = '-Root "%ROOT%"' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'Start-Process' },
            @{ Path = 'internal/DeadlimitUpdater.ps1'; Pattern = 'The local checkout has tracked changes. Commit or revert them before running Deadlimit Updater.' },
            @{ Path = 'internal/src/Deadlimit/Deadlimit.csproj'; Pattern = '<AssemblyName>DeadlimitAggregator</AssemblyName>' },
            @{ Path = 'internal/src/Deadlimit/Program.cs'; Pattern = 'Usage: DeadlimitAggregator.exe' }
          )
          foreach ($check in $forbidden) {
            if (Select-String -LiteralPath $check.Path -SimpleMatch $check.Pattern -Quiet) {
              throw "Forbidden legacy/broken contract remains in $($check.Path): $($check.Pattern)"
            }
          }
      - name: Product naming drift guard
        shell: pwsh
        run: |
          $forbiddenTerms = @(
            ('Deadlimit ' + 'Aggregator'),
            ('Deadlimit ' + 'Max Script'),
            ('Deadlimit ' + 'MaxScript'),
            ('MaxScript ' + 'Deadlimit'),
            ('Deadlimit ' + 'Shader'),
            ('3ds' + ' Max'),
            ('3D' + ' Max')
          )
          foreach ($term in $forbiddenTerms) {
            $matches = @(git grep -n -I -F -- $term -- .)
            if ($LASTEXITCODE -gt 1) {
              throw "git grep failed while checking product naming: $term"
            }
            if ($matches.Count -gt 0) {
              throw "Forbidden legacy/product-drift term '$term' remains:`n$($matches -join "`n")"
            }
          }
          $global:LASTEXITCODE = 0

      - name: Updater root-resolution smoke
        shell: pwsh
        run: |
          $resolved = (& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'internal\DeadlimitUpdater.ps1' -ResolveRootOnly | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Updater root-resolution smoke failed with exit code $LASTEXITCODE"
          }
          $expected = (Resolve-Path '.').Path.TrimEnd('\')
          if (-not [string]::Equals($resolved, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Updater resolved '$resolved', expected '$expected'."
          }
      - name: Updater self-bootstrap and dirty-worktree smoke
        shell: pwsh
        run: internal/tests/updater-dirty-worktree-smoke.ps1
      - name: Root presentation smoke
        shell: cmd
        run: call DeadlimitManager.cmd --refresh-only
      - name: Verify two-shortcut root presentation
        shell: pwsh
        run: |
          $expected = @('Deadlimit Manager.lnk', 'Deadlimit Updater.lnk') | Sort-Object
          $visible = Get-ChildItem -LiteralPath . -Force | Where-Object {
            -not ($_.Attributes -band [IO.FileAttributes]::Hidden) -and
            -not ($_.Attributes -band [IO.FileAttributes]::System)
          } | Select-Object -ExpandProperty Name | Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $visible
          if ($difference) {
            $actual = $visible -join ', '
            throw "Root presentation must expose exactly two shortcuts. Visible entries: $actual"
          }
      - name: Audit remaining Deadlimit identifiers
        shell: pwsh
        run: |
          $matches = git grep -n -i deadlimit -- .
          $grepExit = $LASTEXITCODE
          $matches | Sort-Object | Set-Content -LiteralPath deadlimit-identifier-audit.txt -Encoding utf8
          if ($grepExit -gt 1) {
            throw "git grep failed with exit code $grepExit"
          }
      - name: Upload identifier audit
        uses: actions/upload-artifact@v7
        with:
          name: deadlimit-identifier-audit
          path: deadlimit-identifier-audit.txt
      - name: Startup smoke
        run: |
          dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --release-policy-smoke
          dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke

  publish-latest:
    name: Publish latest artist build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: deadlimit-latest-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build current main package
        shell: pwsh
        run: |
          $version = '0.1.0-main.${{ github.run_number }}'
          internal/release/New-DeadlimitPortable.ps1 -Version $version
      - name: Verify installable package
        shell: pwsh
        run: |
          internal/tests/portable-release-smoke.ps1 `
            -PackagePath artifacts/portable/Deadlimit-win-x64.zip `
            -ChecksumPath artifacts/portable/Deadlimit-win-x64.zip.sha256
      - name: Update rolling artist release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'latest-main'
          $version = '0.1.0-main.${{ github.run_number }}'
          $coreAssets = @(
            'artifacts/portable/Deadlimit-win-x64.zip',
            'artifacts/portable/Deadlimit-win-x64.zip.sha256',
            'artifacts/portable/Install-Deadlimit.cmd',
            'artifacts/portable/Install-Deadlimit.cmd.sha256'
          )
          $metadataAsset = 'artifacts/portable/Deadlimit-release.json'

          $existingTag = & gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 100 `
            --json tagName `
            --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the rolling Deadlimit release.' }
          $releaseExists = -not [string]::IsNullOrWhiteSpace(($existingTag | Select-Object -First 1))

          if ($releaseExists) {
            & gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
              -f "sha=$env:GITHUB_SHA" `
              -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not move the rolling release tag to current main.' }

            & gh release upload $tag @coreAssets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the rolling Deadlimit package.' }
            & gh release upload $tag $metadataAsset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the rolling Deadlimit metadata.' }
            & gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Deadlimit latest ($version)" `
              --notes "Automatically built from the latest successful main commit: $env:GITHUB_SHA" `
              --latest
          }
          else {
            & gh release create $tag @coreAssets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Deadlimit latest ($version)" `
              --notes "Automatically built from the latest successful main commit: $env:GITHUB_SHA" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the rolling Deadlimit release.' }
            & gh release upload $tag $metadataAsset --repo $env:GITHUB_REPOSITORY
          }

          if ($LASTEXITCODE -ne 0) { throw 'Rolling Deadlimit publication failed.' }
