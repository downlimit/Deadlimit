name: One-time Deadlimit product naming migration

on:
  push:
    branches: [ product/deadlimit-scripts-branding ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: product/deadlimit-scripts-branding
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply product naming migration
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess

          root = Path.cwd()

          def tracked_text_files():
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              for item in raw.split(b'\0'):
                  if not item:
                      continue
                  path = root / item.decode('utf-8')
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  yield path, text

          # Product-wide canonical naming. MAXScript remains the implementation language;
          # 3dsMax.ini remains the literal host configuration filename.
          replacements = [
              ('Autodesk 3ds Max', 'Autodesk tooling used by the current MAXScript module'),
              ('Deadlimit Aggregator', 'Deadlimit Manager'),
              ('DeadlimitAggregator.exe', 'DeadlimitManager.exe'),
              ('Deadlimit Max Script', 'Deadlimit Scripts'),
              ('MaxScript Deadlimit', 'Deadlimit Scripts'),
              ('Deadlimit MaxScript', 'Deadlimit Scripts'),
              ('3ds Max', 'current MAXScript host'),
              ('.deadlimit/maxscript-vertcolor-trans', '.deadlimit/scripts'),
              ('.deadlimit\\maxscript-vertcolor-trans', '.deadlimit\\scripts'),
              ('maxscript-vertcolor-trans', 'scripts'),
              ('Deadlimit.MaxScript.PipelineScripts.ms', 'Deadlimit.Scripts.PipelineScripts.ms'),
              ('VertexColorMaxScriptService', 'DeadlimitScriptsService'),
              ('AddMaxScriptFolderRow', 'AddScriptsFolderRow'),
              ('OpenMaxScriptFolder', 'OpenScriptsFolder'),
          ]

          for path, text in list(tracked_text_files()):
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          # Remove migration-only shortcut names rather than turning them into duplicate
          # current-product entries.
          gitignore = root / '.gitignore'
          text = gitignore.read_text(encoding='utf-8')
          text = text.replace('/Deadlimit Manager Updater.lnk\n', '')
          # After the global rename one legacy line collides with the canonical shortcut.
          lines = text.splitlines()
          seen_manager = False
          cleaned = []
          for line in lines:
              if line == '/Deadlimit Manager.lnk':
                  if seen_manager:
                      continue
                  seen_manager = True
              cleaned.append(line)
          gitignore.write_text('\n'.join(cleaned) + '\n', encoding='utf-8', newline='')

          launcher = root / 'DeadlimitManager.cmd'
          text = launcher.read_text(encoding='utf-8')
          block = '    "Deadlimit Manager.lnk"\n    "Deadlimit Manager Updater.lnk"\n    "Deadlimit Manager.lnk"\n'
          if block in text:
              text = text.replace(block, '    "Deadlimit Manager.lnk"\n')
          else:
              # CRLF was normalized by read_text; handle the two migrated legacy entries
              # independently while retaining the canonical entry.
              lines = text.splitlines()
              result = []
              manager_seen = False
              for line in lines:
                  stripped = line.strip()
                  if stripped == '"Deadlimit Manager Updater.lnk"':
                      continue
                  if stripped == '"Deadlimit Manager.lnk"':
                      if manager_seen:
                          continue
                      manager_seen = True
                  result.append(line)
              text = '\n'.join(result) + '\n'
          launcher.write_text(text, encoding='utf-8', newline='')

          # Canonical root product descriptions.
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'It connects an artist-owned project folder, current MAXScript host export, Reduced CSDK, DeadlockTools, and retail Deadlock so the normal iteration loop stays inside one project UI.',
              'It connects an artist-owned project folder, DCC authoring/export, Reduced CSDK, DeadlockTools, and retail Deadlock so the normal iteration loop stays inside one project UI.')
          text = text.replace(
              '- **Deadlimit Scripts** — current MAXScript host helpers used by the DMX and Vertex Color\n  pipeline.',
              '- **Deadlimit Scripts** (**Deadlimit Pipeline Scripts**) — DCC-side authoring and export helpers for the DMX, Vertex Color, and Deadlock/Source 2 pipeline. The current bundled module is MAXScript-based; Blender support can live under the same product.')
          text = text.replace(
              'Blender is planned but unsupported. Shade is experimental; Manager and the Max Script are the current project focus.',
              'The current bundled Deadlimit Scripts module is MAXScript-based; Blender support is planned under the same product. Deadlimit Shade remains experimental.')
          text = text.replace('Autodesk tooling used by the current MAXScript module 2025', 'Deadlimit Scripts MAXScript host: 2025')
          readme.write_text(text, encoding='utf-8', newline='')

          readme_ru = root / 'README.ru.md'
          text = readme_ru.read_text(encoding='utf-8')
          text = text.replace('экспорт из current MAXScript host', 'экспорт из DCC')
          text = text.replace(
              '- **Deadlimit Scripts** — вспомогательные инструменты current MAXScript host для DMX и\n  Vertex Color pipeline.',
              '- **Deadlimit Scripts** (**Deadlimit Pipeline Scripts**) — DCC-инструменты авторинга и экспорта для DMX, Vertex Color и Deadlock/Source 2 pipeline. Текущий встроенный модуль написан на MAXScript; Blender будет развиваться в рамках того же продукта.')
          text = text.replace(
              'Blender запланирован, но пока не поддерживается. Shade экспериментальный; текущий фокус — Manager и Max Script.',
              'Текущий встроенный модуль Deadlimit Scripts написан на MAXScript; поддержка Blender запланирована в рамках того же продукта. Deadlimit Shade пока экспериментальный.')
          text = text.replace('Autodesk tooling used by the current MAXScript module 2025', 'Deadlimit Scripts MAXScript host: 2025')
          readme_ru.write_text(text, encoding='utf-8', newline='')

          # Scripts README: product identity first, host implementation second.
          scripts_readme = root / '.deadlimit' / 'maxscript-vertcolor-trans' / 'README.md'
          if scripts_readme.exists():
              text = scripts_readme.read_text(encoding='utf-8')
              text = text.replace(
                  '`DeadlimitPipelineScripts.ms` is the current current MAXScript host implementation of Deadlimit Scripts.',
                  '`DeadlimitPipelineScripts.ms` is the current MAXScript implementation of **Deadlimit Scripts (Deadlimit Pipeline Scripts)**.')
              text = text.replace(
                  'The implementation filename and existing MaxScript class/global identifiers are retained for compatibility. The project name is `Deadlimit Scripts`.',
                  'The implementation filename and existing MAXScript class/global identifiers are retained for compatibility. `Deadlimit Scripts` is the product name; `Deadlimit Pipeline Scripts` is its long form. Additional DCC implementations, including Blender, share this product scope.')
              text = text.replace('native current MAXScript host rollout floater', 'native MAXScript rollout floater')
              text = text.replace('current Max session', 'current host session')
              text = text.replace('modern current MAXScript host', 'modern MAXScript hosts')
              text = text.replace('current MAXScript host 2025', 'validated 2025 MAXScript host build')
              scripts_readme.write_text(text, encoding='utf-8', newline='')

          # Script UI/header wording; keep API-specific MAXScript/Max identifiers intact.
          script = root / '.deadlimit' / 'maxscript-vertcolor-trans' / 'DeadlimitPipelineScripts.ms'
          if script.exists():
              text = script.read_text(encoding='utf-8')
              text = text.replace('Deadlimit Scripts for current MAXScript host.', 'Deadlimit Pipeline Scripts — current MAXScript module.')
              text = text.replace('throw "current MAXScript host FBX exporter did not create the sidecar."', 'throw "FBX exporter did not create the sidecar."')
              text = text.replace('(current MAXScript host 2015+)', '(supported MAXScript hosts)')
              text = text.replace('in current MAXScript host 2025.', 'in the validated 2025 MAXScript host build.')
              script.write_text(text, encoding='utf-8', newline='')

          # Settings presents Scripts as a product, not the current host application.
          settings = root / 'internal' / 'src' / 'Deadlimit' / 'App' / 'SettingsForm.cs'
          text = settings.read_text(encoding='utf-8')
          text = text.replace('CreatePreferenceCaption("current MAXScript host")', 'CreatePreferenceCaption(UiText.T("Scripts", "Скрипты"))')
          text = text.replace('UiText.T("📂 Deadlimit Scripts", "📂 Deadlimit Scripts")', '"📂 Deadlimit Scripts"')
          text = text.replace('UiText.T("MaxScript folder unavailable", "Папка MaxScript недоступна")', 'UiText.T("Deadlimit Scripts folder unavailable", "Папка Deadlimit Scripts недоступна")')
          settings.write_text(text, encoding='utf-8', newline='')

          # Remove runtime normalization for names that no longer exist in source/UI.
          uitext = root / 'internal' / 'src' / 'Deadlimit' / 'App' / 'UiText.cs'
          text = uitext.read_text(encoding='utf-8')
          text = text.replace('            .Replace("Deadlimit Manager", ProductName, StringComparison.Ordinal)\n', '')
          text = text.replace('            .Replace("DeadlimitManager.exe", "DeadlimitManager.exe", StringComparison.Ordinal)\n', '')
          uitext.write_text(text, encoding='utf-8', newline='')

          # The old forbidden-file checks would become checks against the canonical name after
          # global replacement. Replace them with a repository-wide drift guard assembled from
          # pieces so the forbidden legacy names themselves do not remain tracked.
          build = root / '.github' / 'workflows' / 'build.yml'
          text = build.read_text(encoding='utf-8')
          forbidden_fragments = [
              "            @{ Path = 'internal/src/Deadlimit/Deadlimit.csproj'; Pattern = '<AssemblyName>DeadlimitManager</AssemblyName>' },\n",
              "            @{ Path = 'internal/src/Deadlimit/Deadlimit.csproj'; Pattern = '<Product>Deadlimit Manager</Product>' },\n",
              "            @{ Path = 'internal/src/Deadlimit/Program.cs'; Pattern = 'Usage: DeadlimitManager.exe' },\n",
              "            @{ Path = 'internal/src/Deadlimit/App/StartupProgressForm.cs'; Pattern = 'Text = \"Deadlimit Manager\"' },\n",
              "            @{ Path = 'internal/src/Deadlimit/App/WindowProgressFeature.cs'; Pattern = 'private const string AppTitle = \"Deadlimit Manager\"' }\n",
          ]
          for fragment in forbidden_fragments:
              text = text.replace(fragment, '')
          marker = '      - name: Updater root-resolution smoke\n'
          drift_step = '''      - name: Product naming drift guard\n        shell: pwsh\n        run: |\n          $forbiddenTerms = @(\n            ('Deadlimit ' + 'Aggregator'),\n            ('Deadlimit ' + 'Max Script'),\n            ('Deadlimit ' + 'Shader'),\n            ('3ds' + ' Max')\n          )\n          foreach ($term in $forbiddenTerms) {\n            $matches = @(git grep -n -I -F -- $term -- .)\n            if ($LASTEXITCODE -gt 1) {\n              throw "git grep failed while checking product naming: $term"\n            }\n            if ($matches.Count -gt 0) {\n              throw "Forbidden legacy/product-drift term '$term' remains:`n$($matches -join "`n")"\n            }\n          }\n\n'''
          if drift_step not in text:
              text = text.replace(marker, drift_step + marker)
          build.write_text(text, encoding='utf-8', newline='')

          # Localization smoke no longer whitelists a host product or the retired app name.
          smoke = root / 'internal' / 'tests' / 'ui-localization-smoke.ps1'
          text = smoke.read_text(encoding='utf-8')
          text = text.replace("    'OK', 'current MAXScript host', 'CSDK', 'DMX', 'PNG', '📂', 'Deadlimit Manager'", "    'OK', 'CSDK', 'DMX', 'PNG', '📂', 'Deadlimit Manager', 'Deadlimit Scripts'")
          smoke.write_text(text, encoding='utf-8', newline='')
          '@ | python -

          git mv '.deadlimit/maxscript-vertcolor-trans' '.deadlimit/scripts'
          git mv 'internal/src/Deadlimit/Core/DeadlimitScriptsService.cs' 'internal/src/Deadlimit/Core/DeadlimitScriptsService.cs' 2>$null || $true
          if (Test-Path 'internal/src/Deadlimit/Core/VertexColorMaxScriptService.cs') {
            git mv 'internal/src/Deadlimit/Core/VertexColorMaxScriptService.cs' 'internal/src/Deadlimit/Core/DeadlimitScriptsService.cs'
          }

          # Update any path references after the physical rename.
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = (text
                  .replace('.deadlimit/maxscript-vertcolor-trans', '.deadlimit/scripts')
                  .replace('.deadlimit\\maxscript-vertcolor-trans', '.deadlimit\\scripts')
                  .replace('maxscript-vertcolor-trans', 'scripts'))
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
          PY

          Remove-Item -LiteralPath '.github/workflows/rename-products-once.yml' -Force

          $forbiddenTerms = @(
            ('Deadlimit ' + 'Aggregator'),
            ('Deadlimit ' + 'Max Script'),
            ('Deadlimit ' + 'Shader'),
            ('3ds' + ' Max')
          )
          foreach ($term in $forbiddenTerms) {
            $matches = @(git grep -n -I -F -- $term -- .)
            if ($LASTEXITCODE -gt 1) { throw "git grep failed: $term" }
            if ($matches.Count -gt 0) {
              throw "Product naming migration left '$term':`n$($matches -join "`n")"
            }
          }

          git diff --check

      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj

      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore

      - name: UI localization smoke
        shell: pwsh
        run: internal/tests/ui-localization-smoke.ps1

      - name: Prepare behavior smoke
        shell: pwsh
        run: internal/tests/prepare-behavior-smoke.ps1

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename Deadlimit scripting product to Deadlimit Scripts'
          git push origin HEAD:product/deadlimit-scripts-branding
