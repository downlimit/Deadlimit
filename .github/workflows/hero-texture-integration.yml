name: Hero texture integration

on:
  push:
    branches: [ feature/hero-texture-extraction-main ]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply verified pre-TGA hero texture feature onto current main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '9258d10c354bff96e8f9882457ea7e184703b046'
          $feature = '2a6eae68f8b0c1552149393cf86ca6e3fd45b025'
          $paths = @(
            '.github/workflows/hero-texture-smoke.yml',
            'internal/docs/HERO_TEXTURE_PIPELINE.md',
            'internal/src/Deadlimit/App/SettingsForm.cs',
            'internal/src/Deadlimit/Core/HeroExtractionService.cs',
            'internal/src/Deadlimit/Core/OnlinePreparationSession.cs',
            'internal/src/Deadlimit/Core/ProjectStore.cs',
            'internal/src/Deadlimit/Core/RetailTextureOverrideService.cs',
            'internal/src/Deadlimit/Core/RetailVmdlInheritance.cs',
            'internal/tests/hero-texture-dependency-contract-smoke.ps1',
            'internal/tests/retail-texture-override-resolution-smoke.ps1'
          )

          $patch = Join-Path $env:RUNNER_TEMP 'hero-texture-pre-tga.patch'
          git diff --binary --output=$patch $base $feature -- $paths
          git apply --3way --index $patch

          if (git grep -n -i 'ExportExtractedTexturesAsTga\|Create TGA copies\|Создавать TGA-копии' -- internal/src internal/tests) {
            throw 'Unexpected TGA-copy implementation leaked into the integration.'
          }

          dotnet restore internal/src/Deadlimit/Deadlimit.csproj
          dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
          pwsh -NoProfile -File internal/tests/hero-texture-dependency-contract-smoke.ps1
          pwsh -NoProfile -File internal/tests/retail-texture-override-resolution-smoke.ps1
          pwsh -NoProfile -File internal/tests/window-shell-visibility-smoke.ps1

          git rm -- '.github/workflows/hero-texture-integration.yml'
          git config user.name 'Oleg Knyazev'
          git config user.email 'down.limit@gmail.com'
          git add -- $paths
          git commit -s -m 'Add optional hero texture extraction'
          git push origin HEAD:feature/hero-texture-extraction-main
