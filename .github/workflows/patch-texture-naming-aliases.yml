name: One-shot texture naming alias patch

on:
  push:
    branches:
      - fix/texture-naming-aliases

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Expand texture filename aliases'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/texture-naming-aliases
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch aliases and add regression smoke
        shell: pwsh
        run: internal/tests/_patch-texture-naming-aliases.ps1
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Texture naming alias smoke
        shell: pwsh
        run: internal/tests/texture-naming-alias-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/src/Deadlimit/Core/CustomMaterialAuthoringService.cs internal/tests/texture-naming-alias-smoke.ps1
          git commit -m 'Expand texture filename aliases'
          git push origin HEAD:fix/texture-naming-aliases
