name: One-shot game launch state patch

on:
  push:
    branches:
      - ui/game-launch-state-button

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Make game launch button reflect Deadlock process state'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/game-launch-state-button
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply patch
        shell: pwsh
        run: internal/tests/_patch-game-launch-state.ps1
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Launch game state smoke
        shell: pwsh
        run: internal/tests/launch-game-fastpath-smoke.ps1
      - name: Prepare behavior smoke
        shell: pwsh
        run: internal/tests/prepare-behavior-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/src/Deadlimit/App/ProjectHeaderFeature.cs internal/tests/launch-game-fastpath-smoke.ps1
          git commit -m 'Make game launch button reflect Deadlock process state'
          git push origin HEAD:ui/game-launch-state-button
