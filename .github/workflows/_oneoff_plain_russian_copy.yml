name: One-off plain Russian UI copy

on:
  push:
    branches:
      - fix/plain-russian-ui-copy

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite user-facing jargon
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('internal/src/Deadlimit/App')]
          files = sorted(p for root in roots for p in root.rglob('*.cs'))

          exact = {
              'Подготовить authoring-контент выбранного проекта': 'Подготовить рабочие файлы выбранного проекта',
              'Authoring-контент уже подготовлен': 'Рабочие файлы проекта уже подготовлены',
              'Authoring-контент подготовлен.': 'Рабочие файлы проекта подготовлены.',
              'для authoring используйте': 'для работы с моделью и материалами используйте',
              'Retail source файлов скопировано': 'Файлов из игрового клиента Deadlock скопировано',
              'CSDK content:': 'Папка проекта в CSDK:',
              'CSDK game output: CLEAN.': 'Скомпилированные файлы CSDK: очищены.',
              'из указанной в настройках retail-установки Deadlock': 'из установленного через Steam Deadlock, указанного в настройках',
              'из retail Deadlock': 'из игрового клиента Deadlock',
              'в retail Deadlock': 'в игровой клиент Deadlock',
              'через retail Deadlock': 'через игровой клиент Deadlock',
              'retail Deadlock через Steam': 'Deadlock через Steam',
              'retail Deadlock': 'игровой клиент Deadlock',
              'retail VPK': 'VPK игрового клиента Deadlock',
              'Retail VPK': 'VPK игрового клиента Deadlock',
              'Загрузка retail-модов: автоматически восстановлена. Следующий запуск Deadlock будет использовать исправленный search path.': 'Загрузка модов в игровом клиенте Deadlock автоматически восстановлена. Следующий запуск Deadlock будет использовать исправленный путь поиска ресурсов.',
              'Обновить его из текущей retail-сборки Deadlock?': 'Обновить его из текущей установленной версии Deadlock?',
          }

          english = {
              'authoring content': 'project working files',
              'Authoring content': 'Project working files',
              'while authoring': 'while working on the model and materials',
              'retail Deadlock': 'Deadlock game client',
              'Retail Deadlock': 'Deadlock game client',
              'retail VPK': 'game-client VPK',
              'Retail VPK': 'Game-client VPK',
              'Retail source files': 'Game-client source files',
          }

          cyrillic = re.compile(r'[А-Яа-яЁё]')
          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              old = text
              lines = []
              for line in text.splitlines(keepends=True):
                  if cyrillic.search(line):
                      for src, dst in exact.items():
                          line = line.replace(src, dst)
                  else:
                      for src, dst in english.items():
                          line = line.replace(src, dst)
                  lines.append(line)
              text = ''.join(lines)
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          guide = Path('internal/docs/UI_GUIDELINES.md')
          text = guide.read_text(encoding='utf-8')
          marker = '- Avoid implementation jargon in user-facing tooltips when a plain product term exists.'
          addition = ('\n- Russian UI copy must not use untranslated pipeline jargon such as `authoring-контент` or `retail Deadlock`. '
                      'Say `рабочие файлы проекта` / `файлы проекта` and `игровой клиент Deadlock` instead. '
                      'Technical file/resource names such as DMX, VMAT, VPK, ModelDoc and Material Editor may stay as-is when they identify an actual format or tool.')
          if addition.strip() not in text:
              text = text.replace(marker, marker + addition)
              guide.write_text(text, encoding='utf-8')
              changed.append(str(guide))

          print('Changed:')
          for path in changed:
              print(' -', path)

          string_literal = re.compile(r'"(?:\\.|[^"\\])*"')
          interpolation = re.compile(r'\{[^{}]*\}')
          forbidden = []
          for path in files:
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  literals = string_literal.findall(line)
                  if not literals:
                      continue
                  probe = ' '.join(interpolation.sub('', literal) for literal in literals)
                  if not cyrillic.search(probe):
                      continue
                  low = probe.lower()
                  if 'authoring' in low or 'retail' in low:
                      forbidden.append(f'{path}:{no}: {line.strip()}')
          if forbidden:
              print('Remaining Russian user-facing pipeline jargon:')
              print('\n'.join(forbidden))
              raise SystemExit(1)

          Path('.github/workflows/_oneoff_plain_russian_copy.yml').unlink()
      - name: Commit rewritten copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace pipeline jargon in user-facing copy"
          git push origin HEAD:fix/plain-russian-ui-copy
