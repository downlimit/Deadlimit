name: One-shot source extraction lock fallback

on:
  push:
    branches:
      - fix/source-extraction-lock-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Handle locked 0source root during extraction'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-extraction-lock-fallback
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply patch
        shell: pwsh
        run: internal/tests/_patch-source-extraction-lock-fallback.ps1
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Hero extraction publish smoke
        shell: pwsh
        run: internal/tests/hero-extraction-publish-smoke.ps1
      - name: Prepare behavior smoke
        shell: pwsh
        run: internal/tests/prepare-behavior-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/src/Deadlimit/Core/HeroExtractionService.cs internal/tests/hero-extraction-publish-smoke.ps1 internal/tests/prepare-behavior-smoke.ps1
          git commit -m 'Handle locked 0source root during extraction'
          git push origin HEAD:fix/source-extraction-lock-fallback
