name: Temporary main layout repair

on:
  push:
    branches: [ fix/extract-ellipsis-main-layout ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair stable extraction control wiring
        shell: pwsh
        run: |
          $mainPath = 'internal/src/Deadlimit/App/MainForm.cs'
          $main = Get-Content -LiteralPath $mainPath -Raw
          $mainNeedle = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAgIHByaXZhdGUgcmVhZG9ubHkgQnV0dG9uIF9leHRyYWN0SGVyb0J1dHRvbiA9IG5ldygpCiAgICB7CiAgICAgICAgVGV4dCA9IFVpVGV4dC5UKCJFWFRSQUNUIEhFUk8gU09VUkNF4oCmIiwgItCY0JfQktCb0JXQp9CsINCY0KHQpdCe0JTQndCY0JrQmCDQk9CV0KDQntCv4oCmIiksCiAgICAgICAgQXV0b1NpemUgPSB0cnVlLAogICAgfTsK'))
          $mainReplacement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $mainNormalized = $main.Replace("`r`n", "`n")
          if (-not $mainNormalized.Contains($mainNeedle)) { throw 'MainForm extraction button anchor not found.' }
          $mainNormalized = $mainNormalized.Replace($mainNeedle, $mainReplacement)
          [IO.File]::WriteAllText($mainPath, $mainNormalized, [Text.UTF8Encoding]::new($false))

          $buildPath = 'internal/src/Deadlimit/App/BuildFeature.cs'
          $build = Get-Content -LiteralPath $buildPath -Raw
          $buildNeedle = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $buildReplacement = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $buildNormalized = $build.Replace("`r`n", "`n")
          if (-not $buildNormalized.Contains($buildNeedle)) { throw 'BuildFeature top-bar anchor not found.' }
          $buildNormalized = $buildNormalized.Replace($buildNeedle, $buildReplacement)
          [IO.File]::WriteAllText($buildPath, $buildNormalized, [Text.UTF8Encoding]::new($false))

          $testPath = 'internal/tests/ui-agent-contract-smoke.ps1'
          $test = Get-Content -LiteralPath $testPath -Raw
          if (-not $test.Contains('UiControlNames.ExtractHeroSourceButton')) {
            $append = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
            $marker = "Write-Host 'UI agent contract smoke passed.'"
            if (-not $test.Contains($marker)) { throw 'UI smoke completion marker not found.' }
            $test = $test.Replace($marker, $append + "`r`n" + $marker)
            [IO.File]::WriteAllText($testPath, $test, [Text.UTF8Encoding]::new($false))
          }

          git config user.name 'Oleg Knyazev'
          git config user.email 'down.limit@gmail.com'
          git add -- $mainPath $buildPath $testPath
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Decouple main layout from extraction button copy`n`nSigned-off-by: Oleg Knyazev <down.limit@gmail.com>"
          git push origin HEAD:fix/extract-ellipsis-main-layout
