name: One-shot extracted texture path patch

on:
  push:
    branches:
      - fix/extracted-texture-resource-paths

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Preserve extracted texture resource directories'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extracted-texture-resource-paths
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply patch
        shell: pwsh
        run: internal/tests/_patch-extracted-texture-resource-paths.ps1
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Build
        run: dotnet build internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-restore
      - name: Hero extraction dependency path smoke
        shell: pwsh
        run: internal/tests/hero-extraction-dependency-path-smoke.ps1
      - name: Startup smoke
        run: dotnet run --project internal/src/Deadlimit/Deadlimit.csproj --configuration Release --no-build -- --startup-smoke
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/src/Deadlimit/Core/HeroExtractionService.cs internal/tests/hero-extraction-dependency-path-smoke.ps1
          git commit -m 'Preserve extracted texture resource directories'
          git push origin HEAD:fix/extracted-texture-resource-paths
