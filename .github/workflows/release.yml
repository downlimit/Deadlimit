name: Publish source milestone

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "I approve publishing this source milestone after successful Build and Launch game checks for this commit"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Require successful native checks for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          for name in build smoke; do
            conclusion="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100" \
                --jq "[.check_runs[] | select(.name == \"$name\" and .head_sha == \"$TARGET_SHA\")] | sort_by(.completed_at) | last | .conclusion // empty"
            )"
            if [[ "$conclusion" != "success" ]]; then
              echo "Required check '$name' on $TARGET_SHA is '$conclusion' (expected success)."
              echo "Run Build and Launch game fastpath smoke manually for this commit before publishing."
              exit 1
            fi
          done

      - name: Skip stale main commit
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$TARGET_SHA" == "$current_main" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale main commit $TARGET_SHA; current main is $current_main."
          fi

      - name: Read release version
        if: steps.freshness.outputs.current == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' \
              internal/src/Deadlimit/Deadlimit.csproj \
              | head -n 1
          )"
          if [[ -z "$version" ]]; then
            echo "Deadlimit Manager version was not found."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether milestone already exists
        if: steps.freshness.outputs.current == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare installer checksum
        if: steps.freshness.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Install-Deadlimit.cmd > Install-Deadlimit.cmd.sha256

      - name: Publish numbered source milestone
        if: steps.freshness.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Deadlimit $VERSION is a source milestone for the Git-based distribution model.

          **For artists:** use \`Install-Deadlimit.cmd\`. The installer installs and updates Deadlimit Manager from the current \`main\` branch. This tag records the source state at the $VERSION milestone; it is not a frozen binary package.

          No Deadlimit binary ZIP is published. The only user-facing release assets are the installer and its SHA-256 checksum. GitHub's automatic **Source code** archives are source snapshots, not installer packages.

          See \`CHANGELOG.md\` for the milestone changes.
          EOF

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$TAG" \
            Install-Deadlimit.cmd \
            Install-Deadlimit.cmd.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Deadlimit $VERSION" \
            --notes-file "$notes" \
            "${prerelease[@]}"
