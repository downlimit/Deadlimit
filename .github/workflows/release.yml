name: Publish source milestone

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-source-milestone to confirm this release.'
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: deadlimit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-source-milestone'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the current main commit and approved manual Windows validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo 'Refusing a source milestone for a stale main commit.'
            exit 1
          fi
          validation="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "full-windows" and .conclusion == "success")] | length')"
          if [[ "$validation" -lt 1 ]]; then
            echo 'Run the Build workflow manually on this main SHA and pass full-windows first.'
            exit 1
          fi
      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' internal/src/Deadlimit/Deadlimit.csproj | head -n 1)"
          if [[ -z "$version" ]]; then
            echo 'Deadlimit version was not found.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether milestone already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare installer checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: sha256sum Install-Deadlimit.cmd > Install-Deadlimit.cmd.sha256
      - name: Publish source milestone (no binary ZIP)
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Deadlimit $VERSION is a source milestone for Git-based distribution.

          Install using \`Install-Deadlimit.cmd\` from current \`main\`. The tag records source state, not a frozen binary build.
          The only attached files are the installer CMD and its SHA-256 checksum. No binary ZIP is published.
          See \`CHANGELOG.md\` for details.
          EOF
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$TAG" Install-Deadlimit.cmd Install-Deadlimit.cmd.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Deadlimit $VERSION" --notes-file "$notes" "${prerelease[@]}"
