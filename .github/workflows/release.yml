name: Publish portable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag is not supported: $tag"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Repository content policy
        shell: pwsh
        run: internal/tests/open-source-content-policy-smoke.ps1
      - name: Portable updater transaction smoke
        shell: pwsh
        run: internal/tests/portable-release-smoke.ps1
      - name: Installer and unified updater smoke
        shell: pwsh
        run: internal/tests/installer-updater-smoke.ps1
      - name: Build portable package
        shell: pwsh
        run: internal/release/New-DeadlimitPortable.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Extracted portable artifact smoke
        shell: pwsh
        run: |
          internal/tests/portable-release-smoke.ps1 `
            -PackagePath artifacts/portable/Deadlimit-win-x64.zip `
            -ChecksumPath artifacts/portable/Deadlimit-win-x64.zip.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            'artifacts/portable/Deadlimit-win-x64.zip',
            'artifacts/portable/Deadlimit-win-x64.zip.sha256',
            'artifacts/portable/Install-Deadlimit.cmd',
            'artifacts/portable/Install-Deadlimit.cmd.sha256',
            '--verify-tag',
            '--generate-notes',
            '--title', 'Deadlimit ${{ steps.version.outputs.version }}'
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
