name: Portable release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        default: 0.1.0-beta.1
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore internal/src/Deadlimit/Deadlimit.csproj
      - name: Portable updater transaction smoke
        shell: pwsh
        run: internal/tests/portable-release-smoke.ps1
      - name: Build self-contained portable package
        shell: pwsh
        run: internal/release/New-DeadlimitPortable.ps1 -Version '${{ inputs.version }}'
      - name: Install packaged artifact smoke
        shell: pwsh
        run: |
          internal/tests/portable-release-smoke.ps1 `
            -PackagePath artifacts/portable/Deadlimit-win-x64.zip `
            -ChecksumPath artifacts/portable/Deadlimit-win-x64.zip.sha256
      - name: Upload private rehearsal artifact
        uses: actions/upload-artifact@v7
        with:
          name: Deadlimit-${{ inputs.version }}-win-x64
          path: |
            artifacts/portable/Deadlimit-win-x64.zip
            artifacts/portable/Deadlimit-win-x64.zip.sha256
            artifacts/portable/DeadlimitPortableUpdater.ps1
            artifacts/portable/DeadlimitPortableUpdater.ps1.sha256
            Install-Deadlimit.cmd
          if-no-files-found: error
